name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pvptest-jar
          path: |
            build/libs/pvptest-*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/pvptest-1.0.0.jar \
            --title "PvP Test Client build ${{ github.run_number }}" \
            --notes "Fabric 26.2 jar. Needs Fabric Loader 0.19.3+ and Fabric API 0.152.2+26.2."
