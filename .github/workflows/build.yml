name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Build
        run: gradle build --no-daemon

      - name: Inspect APIs
        if: always()
        run: |
          set +e
          MC=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2/minecraft-merged-deobf-26.2.jar
          M=/home/runner/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api
          KM=$(find $M/fabric-key-mapping-api-v1 -name '*.jar' ! -name '*sources*' | head -1)
          CM=$(find $M/fabric-command-api-v2 -name '*.jar' ! -name '*sources*' | head -1)
          LC=$(find $M/fabric-lifecycle-events-v1 -name '*.jar' ! -name '*sources*' | head -1)
          echo "##### KeyMappingHelper"; javap -cp "$KM:$MC" net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper
          echo "##### ClientCommands"; javap -cp "$CM:$MC" net.fabricmc.fabric.api.client.command.v2.ClientCommands
          echo "##### FabricClientCommandSource"; javap -cp "$CM:$MC" net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource | grep -iE "send|feedback"
          echo "##### ClientCommandRegistrationCallback"; javap -cp "$CM:$MC" net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback
          echo "##### ClientTickEvents"; javap -cp "$LC:$MC" net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pvptest-jar
          path: |
            build/libs/pvptest-*.jar
            !build/libs/*-sources.jar
