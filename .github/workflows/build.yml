name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Build
        run: gradle build --no-daemon

      - name: Inspect APIs
        if: always()
        run: |
          set +e
          MC=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2/minecraft-merged-deobf-26.2.jar
          echo "##### MouseHandler"; javap -cp $MC -p net.minecraft.client.MouseHandler | grep -E "onButton|onPress|isMouseGrabbed|isLeftPressed|isRightPressed|class "
          echo "##### MouseButtonInfo"; javap -cp $MC -p net.minecraft.client.input.MouseButtonInfo 2>&1 | head -12
          echo "##### MouseButtonEvent"; javap -cp $MC -p net.minecraft.client.input.MouseButtonEvent 2>&1 | head -12
          echo "##### Window handle"; javap -cp $MC -p com.mojang.blaze3d.platform.Window | grep -E "handle|getWindow"
          echo "##### Minecraft getWindow/mouseHandler"; javap -cp $MC -p net.minecraft.client.Minecraft | grep -E "getWindow|mouseHandler|window;"
          echo "##### KeyMapping static"; javap -cp $MC -p net.minecraft.client.KeyMapping | grep -E "static .*(click|set|release|setAll)"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pvptest-jar
          path: |
            build/libs/pvptest-*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/pvptest-1.0.0.jar \
            --title "PvP Test Client build ${{ github.run_number }}" \
            --notes "Fabric 26.2 jar. Needs Fabric Loader 0.19.3+ and Fabric API 0.152.2+26.2."
