name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Build
        run: gradle build --no-daemon

      - name: Inspect APIs
        if: always()
        run: |
          set +e
          echo "== candidate jars"
          find ~/.gradle -name '*.jar' ! -name '*sources*' \( -path '*loom*' -o -path '*fabric-api*' -o -path '*net.fabricmc*' \) | head -80
          MC=$(find ~/.gradle -name '*.jar' ! -name '*sources*' -size +20M | grep -iE 'minecraft|loom' | head -1)
          echo "MC jar: $MC"
          for c in net.minecraft.client.Minecraft net.minecraft.client.player.LocalPlayer net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' net.minecraft.world.entity.Entity net.minecraft.world.entity.player.Player; do
            echo "=== $c"; javap -cp "$MC" -p "$c" 2>&1 | grep -iE "screen|startAttack|startUseItem|shouldEntityAppearGlowing|getTeamColor|Message|overlay|Category|register|KeyMapping\(|keyAttack|keyUse|isDown|consumeClick|class |interface " | head -40
          done
          echo "== fabric api classes"
          for j in $(find ~/.gradle -name '*.jar' ! -name '*sources*' -path '*fabric*' | head -200); do
            unzip -l "$j" 2>/dev/null | grep -iE "ClientCommand|KeyBinding|KeyMapping|ClientTickEvents|ClientModInitializer" | sed "s#^#$(basename $j): #"
          done | head -60
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pvptest-jar
          path: |
            build/libs/pvptest-*.jar
            !build/libs/*-sources.jar
